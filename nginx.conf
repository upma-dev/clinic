################################################################################
# Standard Operating Procedure (SOP) HTTP Rate Limiting Architecture
# APPZETO MERN Standard Version: 1.0
# Nginx Deployment Configuration
################################################################################

# Global Rate Limiting Zones (Place inside Nginx http {} block in /etc/nginx/nginx.conf):
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    server_name  appzeto.com  www.appzeto.com;

    ########################################################
    # FRONTEND CONFIGURATION
    ########################################################
    root /var/www/appzeto;
    index index.html;

    ########################################################
    # SERVER PERFORMANCE
    ########################################################
    client_max_body_size 100M;
    keepalive_timeout 65;

    ########################################################
    # GZIP COMPRESSION
    ########################################################
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    ########################################################
    # REACT SPA FRONTEND
    ########################################################
    location / {
        try_files $uri $uri/ /index.html;
    }

    ########################################################
    # STATIC UPLOADS
    ########################################################
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    ########################################################
    # HEALTH CHECK
    ########################################################
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ########################################################
    # READINESS CHECK
    ########################################################
    location /ready {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ########################################################
    # NODE.JS BACKEND API
    ########################################################
    location /api/ {
        # Rate limiting
        # Requires global limit_req_zone configuration
        limit_req zone=api_limit burst=60 nodelay;
        # Maximum connections per IP
        limit_conn perip 30;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Disable websocket headers for normal API
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Response buffering
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    ########################################################
    # SOCKET.IO WEBSOCKET SERVER
    ########################################################
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        proxy_cache_bypass $http_upgrade;
    }

    ########################################################
    # SSL CONFIGURATION
    ########################################################
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    ssl_certificate     /etc/letsencrypt/live/appzeto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appzeto.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

############################################################
# HTTP → HTTPS REDIRECT
############################################################
server {
    listen 80;
    listen [::]:80;
    server_name appzeto.com www.appzeto.com;
    return 301 https://$host$request_uri;
}
